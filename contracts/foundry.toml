[profile.default]
# evm_version 固定 paris：BTY EVM 主网（chainId 2999）实测不支持 PUSH0（Shanghai+），
# cancun 产物（含 PUSH0）在主网部署会 invalid opcode，勿改回 cancun。
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
# 1：Escrow 同时容纳原生/ERC20 托管、售后留存与争议后，runs=200 会超过 EIP-170 213B；
# runs 只影响 gas/尺寸权衡，不改变语义（与 via_ir 不同，后者已因可观察行为差异被否决）。
optimizer_runs = 1
evm_version = "paris"
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./out" }]

# via_ir：**不要开**（2026-10-15 实测否决，这一条是给下一个人看的）。
# 背景：`MarketplaceRegistry` 加多店逻辑后运行时字节码顶到 27.6 KB，超过 EIP-170 的 24 576 上限，
# 部署直接 `CreateContractSizeLimit`（真链同样有这条限制，不是本机 anvil 的保守估计）。
# viaIR 一开就降到 20.1 KB，看起来是解药——但它**改变了可观察行为**，因此被否决：
#   `testClaimUnstakeRequiresApprovalTimeout` 与 `testSetRejectGraceCannotShrinkInFlightReleaseWindow`
#   在 viaIR 下失败、关掉就通过（"自动放行时刻 = 申请时刻 + 窗口: 3601 != 7202" 这类读数**差一倍**），
#   都落在"`vm.warp` 推进时间后、同一笔调用里多次读 `block.timestamp`/`block.number`"这条路径上。
#   **资金合约的编译管线不该改变任何可观察行为**；一个只在优化器下出现的时间读数差异，
#   没有任何理由相信它只影响测试。
# 结论：尺寸问题必须用**不改 pipeline** 的办法解决（编号内部表示换成 bytes32、
# 去掉按 host 反查店主的线性搜索、删死代码、收紧返回值的形状），而不是换编译器后端。
via_ir = false

# 原生托管守恒不变量（test/EscrowInvariant.t.sol）的规模。32×32 已能覆盖
# createOrder / releaseExpired 的随机组合，同时让 forge test 保持秒级。
[invariant]
runs = 32
depth = 32

[fmt]
line_length = 120
tab_width = 4
